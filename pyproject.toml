[project]
name = "readmas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.7.0",
    "autopep8>=2.0.0",
    "black>=23.12.0",
    "chromadb>=1.3.4",
    "datasets>=4.3.0",
    "deepeval>=3.6.9",
    "evalplus>=0.3.1",
    "google-adk[a2a,eval]>=1.18.0",
    "human-eval>=1.0.0",
    "jupyterlab>=4.0.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.0.5",
    "langchain-community>=0.0.10",
    "langchain-core>=0.3.29",
    "langchain-ollama>=0.0.1",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.10",
    "litellm>=1.72.4,<=1.76.3",
    "loguru>=0.7.0",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "pyink>=24.10.1",
    "pypdf>=6.3.0",
    "pytest>=7.4.0",
    "pytest-mock>=1.17.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "rouge-score>=0.1.2",
    "streamlit>=1.32.0",
    "torch>=2.9.1",
    "tqdm>=4.66.0",
    "typer>=0.20.0",
    "uuid>=1.30",
]

[project.scripts]
readmas = "main:app"

[tool.pyink]
line-length = 100
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
