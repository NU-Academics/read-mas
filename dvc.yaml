stages:
  train:
    cmd: python -m src.eval.run train -t ${train.agent_name} -m ${train.model} 
      -r ${train.rag} -n ${train.no_opt} -x
    deps:
    - src/eval/run.py
    - src/eval/evaluators/agent_evals/trainer.py
    - src/prompt_templates
    - data/goldens/${train.agent_name}/train.json
    params:
    - train.agent_name
    - train.model
    - train.rag
    - train.no_opt
    outs:
    - runs/train_runs
  eval:
    cmd: python -m src.eval.run eval -t ${eval.agent_name} -m ${eval.model} -r 
      ${eval.rag} -x
    deps:
    - src/eval/run.py
    - src/eval/evaluators/agent_evals/evaluator.py
    - data/goldens/${eval.agent_name}/eval.json
    params:
    - eval.agent_name
    - eval.model
    - eval.rag
    outs:
    - runs/eval_runs
  benchmark:
    cmd: python -m src.eval.run benchmark -t ${benchmark.agent_name} -m 
      ${benchmark.model} -r ${benchmark.rag} -x
    deps:
    - src/eval/run.py
    - src/eval/evaluators/agent_evals/evaluator.py
    - data/goldens/${benchmark.agent_name}/benchmark.json
    params:
    - benchmark.agent_name
    - benchmark.model
    - benchmark.rag
    outs:
    - runs/benchmark_runs
  code_benchmark:
    cmd: python -m src.eval.run code-benchmark -t ${code.agent_name} -m 
      ${code.model} -d ${code.dataset} -s ${code.samples} -r ${code.rag} -x
    deps:
    - src/eval/run.py
    - src/eval/evaluators/benchmark_evals/coding_benchmarker.py
    - data/samples/${code.dataset}
    params:
    - code.agent_name
    - code.model
    - code.rag
    - code.dataset
    - code.samples
    outs:
    - runs/code_benchmark_runs
  llm_code_benchmark:
    cmd: python -m src.eval.run llm-benchmark -m ${llm.model} -d ${llm.dataset} 
      -s ${llm.samples} -x
    deps:
    - src/eval/run.py
    - src/eval/evaluators/benchmark_evals/coding_benchmarker.py
    - data/samples/${llm.dataset}
    params:
    - llm.model
    - llm.dataset
    - llm.samples
    outs:
    - runs/llm_benchmark_runs
metrics:
- runs/train_runs/metrics.json
- runs/eval_runs/metrics.json
- runs/llm_benchmark_runs/metrics.json
- runs/code_benchmark_runs/metrics.json
- runs/benchmark_runs/metrics.json
plots:
- runs/train_runs/plots/metrics:
    x: step
- runs/eval_runs/plots/metrics:
    x: step
- runs/llm_benchmark_runs/plots/metrics:
    x: step
- runs/code_benchmark_runs/plots/metrics:
    x: step
- runs/benchmark_runs/plots/metrics:
    x: step
