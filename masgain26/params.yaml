# RQ1 default configuration: read_agent (multi-agent) with Gemini 2.5 Flash, RAG enabled.
# For RQ1 also run with -t single_agent and with -m the OpenAI GPT-5-mini model
# (see README.md "Reproducing RQ1" for the full experiment matrix).
benchmark:
  agent_name: read_agent
  model: gemini-2.5-flash
  rag: true
  rag_index: devbench_benchmark

